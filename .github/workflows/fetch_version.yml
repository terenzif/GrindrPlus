name: Fetch latest Grindr version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run version fetcher script
        run: |
          # Writes latest_play.json (+ deprecated version.json mirror). Never touches supported_target.json.
          python fetch_version.py --also-version-json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_play.json version.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No version changes."
            exit 0
          fi
          git commit -m "GrindrPlus: Fetch latest Play Grindr version"
          git push
