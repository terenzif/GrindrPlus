name: Build APK and Release

# Fork-friendly build for terenzif/GrindrPlus.
# - Always builds debug + release APKs and uploads artifacts (no upstream Telegram required).
# - Signs release only when KEYSTORE_* secrets are present.
# - Publishes a GitHub Release when create_release=true or on v* tags (needs contents:write).
# - Telegram upload is optional and skipped when secrets are missing.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release with APKs"
        required: false
        default: false
        type: boolean
      share_to_telegram:
        description: "Upload APKs to Telegram (requires TELEGRAM_* secrets)"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag (default: build-<shortsha> or git tag)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build / sign / publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Version / commit metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION_INFO=$(./gradlew printVersionInfo --quiet | grep 'VERSION_INFO:' | sed 's/VERSION_INFO: //;s/ (.*)//' || true)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DATE_TODAY=$(date -u +%Y-%m-%d)
          echo "VERSION_INFO=${VERSION_INFO}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "DATE_TODAY=${DATE_TODAY}" >> "$GITHUB_ENV"
          echo "version_info=${VERSION_INFO}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -x lint

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -x lint

      - name: Locate APKs
        id: apks
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Detect signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KEYSTORE_* secrets missing — uploading unsigned release APK. Add secrets to enable signing."
          fi

      - name: Sign release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
          BT=$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)
          "${ANDROID_HOME}/build-tools/${BT}/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "${RELEASE_APK}" \
            "${RELEASE_APK}"
          "${ANDROID_HOME}/build-tools/${BT}/apksigner" verify "${RELEASE_APK}"
          rm -f /tmp/keystore.jks

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Debug APK - ${{ env.DATE_TODAY }}-${{ env.COMMIT_SHA }}"
          path: ${{ env.DEBUG_APK }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Release APK - ${{ env.DATE_TODAY }}-${{ env.COMMIT_SHA }}"
          path: ${{ env.RELEASE_APK }}

      - name: Resolve release tag
        id: tag
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="build-${{ env.COMMIT_SHA }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="GrindrPlus ${{ env.VERSION_INFO }} (${TAG})"
          NOTES="$(cat <<EOF
          Fork build for **terenzif/GrindrPlus**.

          - Commit: \`${{ env.COMMIT_SHA }}\`
          - Version info: \`${{ env.VERSION_INFO }}\`
          - Signed: \`${{ steps.signing.outputs.available }}\`

          Install via LSPosed (JingMatrix). Target Grindr: see README / \`supported_target.json\`.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEBUG_APK" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$DEBUG_APK" "$RELEASE_APK" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Detect Telegram secrets
        id: telegram
        if: github.event_name == 'workflow_dispatch' && inputs.share_to_telegram
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TELEGRAM_* secrets missing — skipping Telegram upload (fork-friendly)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Telegram (optional)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.share_to_telegram &&
          steps.telegram.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -F document=@"${DEBUG_APK}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          curl -fsS -F document=@"${RELEASE_APK}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
