name: Build APK and Release

# Build for terenzif/grindr-plus-plus.
# - Always builds debug + release APKs and uploads artifacts (no upstream Telegram required).
# - Signs release only when KEYSTORE_* secrets are present.
# - Publishes a GitHub Release when create_release=true or on v* tags (needs contents:write).
# - Telegram upload is optional and skipped when secrets are missing.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release with APKs"
        required: false
        default: false
        type: boolean
      share_to_telegram:
        description: "Upload APKs to Telegram (requires TELEGRAM_* secrets)"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag (default: build-<shortsha> or git tag)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build / sign / publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Runner-provided Android SDK (same approach as CodeQL). Do not use
      # android-actions/setup-android — legacy `tools` package breaks sdkmanager.

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Version / commit metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION_INFO=$(./gradlew printVersionInfo --quiet | grep 'VERSION_INFO:' | sed 's/VERSION_INFO: //;s/ (.*)//' || true)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DATE_TODAY=$(date -u +%Y-%m-%d)
          echo "VERSION_INFO=${VERSION_INFO}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "DATE_TODAY=${DATE_TODAY}" >> "$GITHUB_ENV"
          echo "version_info=${VERSION_INFO}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build debug APKs (morphe + alloy)
        run: ./gradlew --no-daemon assembleMorpheDebug assembleAlloyDebug -x lint

      - name: Build release APKs (morphe + alloy + embed payload)
        run: ./gradlew --no-daemon assembleMorpheRelease assembleAlloyRelease assembleEmbedRelease -x lint

      - name: Locate APKs
        id: apks
        run: |
          set -euo pipefail
          MORPHE_DEBUG=$(find app/build/outputs/apk/morphe/debug -name '*.apk' | head -n1)
          ALLOY_DEBUG=$(find app/build/outputs/apk/alloy/debug -name '*.apk' | head -n1)
          MORPHE_RELEASE=$(find app/build/outputs/apk/morphe/release -name '*.apk' | head -n1)
          ALLOY_RELEASE=$(find app/build/outputs/apk/alloy/release -name '*.apk' | head -n1)
          EMBED_RELEASE=$(find app/build/outputs/apk/embed/release -name '*.apk' | head -n1)
          test -n "$MORPHE_DEBUG" && test -n "$ALLOY_DEBUG"
          test -n "$MORPHE_RELEASE" && test -n "$ALLOY_RELEASE"
          echo "MORPHE_DEBUG=$MORPHE_DEBUG" >> "$GITHUB_ENV"
          echo "ALLOY_DEBUG=$ALLOY_DEBUG" >> "$GITHUB_ENV"
          echo "MORPHE_RELEASE=$MORPHE_RELEASE" >> "$GITHUB_ENV"
          echo "ALLOY_RELEASE=$ALLOY_RELEASE" >> "$GITHUB_ENV"
          echo "EMBED_RELEASE=$EMBED_RELEASE" >> "$GITHUB_ENV"
          # Compat aliases for signing / telegram steps
          echo "DEBUG_APK=$MORPHE_DEBUG" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$MORPHE_RELEASE" >> "$GITHUB_ENV"

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KEYSTORE_* secrets missing — uploading unsigned release APK. Add secrets to enable signing."
          fi

      - name: Sign release APKs
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.p12
          BT=$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)
          sign_one() {
            local in="$1"
            "${ANDROID_HOME}/build-tools/${BT}/apksigner" sign \
              --ks /tmp/keystore.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "${in}" \
              "${in}"
            "${ANDROID_HOME}/build-tools/${BT}/apksigner" verify "${in}"
            case "$in" in
              *-unsigned.apk) out="${in%-unsigned.apk}.apk" ;;
              *) out="${in%.apk}-signed.apk" ;;
            esac
            mv "$in" "$out"
            echo "$out"
          }
          MORPHE_RELEASE=$(sign_one "$MORPHE_RELEASE")
          ALLOY_RELEASE=$(sign_one "$ALLOY_RELEASE")
          if [ -n "${EMBED_RELEASE:-}" ]; then
            EMBED_RELEASE=$(sign_one "$EMBED_RELEASE")
          fi
          rm -f /tmp/keystore.p12
          echo "MORPHE_RELEASE=$MORPHE_RELEASE" >> "$GITHUB_ENV"
          echo "ALLOY_RELEASE=$ALLOY_RELEASE" >> "$GITHUB_ENV"
          echo "EMBED_RELEASE=$EMBED_RELEASE" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$MORPHE_RELEASE" >> "$GITHUB_ENV"

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Debug APKs - ${{ env.DATE_TODAY }}-${{ env.COMMIT_SHA }}"
          path: |
            ${{ env.MORPHE_DEBUG }}
            ${{ env.ALLOY_DEBUG }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Release APKs - ${{ env.DATE_TODAY }}-${{ env.COMMIT_SHA }}"
          path: |
            ${{ env.MORPHE_RELEASE }}
            ${{ env.ALLOY_RELEASE }}
            ${{ env.EMBED_RELEASE }}

      - name: Resolve release tag
        id: tag
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="build-${{ env.COMMIT_SHA }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="Grindr++ ${{ env.VERSION_INFO }} (${TAG})"
          NOTES="$(cat <<EOF
          Dual APK build for **terenzif/grindr-plus-plus** (ADR 0005).

          - Commit: \`${{ env.COMMIT_SHA }}\`
          - Version info: \`${{ env.VERSION_INFO }}\`
          - Signed: \`${{ steps.signing.outputs.available }}\`

          **Install**
          - **Morphe** (\`com.gpp.morphe\`) — rootless Manager / LSPatch
          - **Alloy** (\`com.gpp.alloy\`) — Vector module ([JingMatrix/Vector](https://github.com/JingMatrix/Vector))
          - **embed** (\`com.gpp.morphe.payload\`) — slim \`-m\` payload (build artifact)

          UI label is **Grindr++** for both user APKs. See \`docs/dual-apk-migration.md\`.
          EOF
          )"
          FILES=("$MORPHE_DEBUG" "$ALLOY_DEBUG" "$MORPHE_RELEASE" "$ALLOY_RELEASE")
          if [ -n "${EMBED_RELEASE:-}" ]; then FILES+=("$EMBED_RELEASE"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Detect Telegram secrets
        id: telegram
        if: github.event_name == 'workflow_dispatch' && inputs.share_to_telegram
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TELEGRAM_* secrets missing — skipping Telegram upload (fork-friendly)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Telegram (optional)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.share_to_telegram &&
          steps.telegram.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -F document=@"${MORPHE_DEBUG}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          curl -fsS -F document=@"${ALLOY_DEBUG}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          curl -fsS -F document=@"${MORPHE_RELEASE}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          curl -fsS -F document=@"${ALLOY_RELEASE}" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
