name: Verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-debug:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Runner-provided Android SDK (same approach as CodeQL). Do not use
      # android-actions/setup-android — legacy `tools` package breaks sdkmanager.

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testMorpheDebugUnitTest testAlloyDebugUnitTest

      - name: Assemble debug APKs (morphe + alloy)
        run: ./gradlew --no-daemon assembleMorpheDebug assembleAlloyDebug -x lint

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: gpp-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/morphe/debug/*.apk
            app/build/outputs/apk/alloy/debug/*.apk
          if-no-files-found: error
